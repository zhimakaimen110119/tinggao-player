<!DOCTYPE html>
<!--
用法（5 行）：
1. 把本 HTML 和 mp3 一起 AirDrop 到 iPhone，存进「文件」App 同一文件夹。
2. 在「文件」里点本 HTML（或分享→用 Safari 打开），点「选音频」选那个 mp3。
3. 听到问题就点颜色键：红=念错 橙=太快/停顿怪 黄=文案/听感 蓝=音效 灰=备注。
4. 绿色「改过」标签=上一版以来改动处，点一下直接跳去听；列表可写备注/删除，自动存本机。
5. 听完点「分享」或「复制清单」发回给 Grok Bot（时间精确到 mm:ss.s）；也可下载 JSON。
-->
<html lang="zh"><head><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="听稿"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>听稿</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1115;color:#e8e8ea;font:16px -apple-system,"PingFang SC",sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
h1{font-size:18px;margin:12px 0 8px}
.card{background:#181b22;border-radius:16px;padding:12px;margin:10px 0}
button,label.btn{border:0;border-radius:14px;background:#262b36;color:#fff;font-size:17px;padding:14px 10px;min-height:52px;display:inline-flex;align-items:center;justify-content:center}
button:active{transform:scale(.96);filter:brightness(1.3)}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text],textarea{width:100%;background:#0f1115;color:#fff;border:1px solid #333;border-radius:10px;padding:10px;font-size:16px}
#name{font-size:13px;color:#9aa;word-break:break-all;margin-top:6px}
#time{font-size:34px;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0}
#bar{position:relative;height:50px}
#seek{width:100%;height:44px;margin:6px 0 0}
#chips{position:absolute;left:0;right:0;top:0;height:12px;pointer-events:none}
#chips i{position:absolute;width:4px;height:10px;border-radius:2px;top:0}
#chips i.cg{top:auto;bottom:-40px;height:8px;width:8px;border-radius:50%;background:#22c55e}
.sp.on{background:#4a6cf7}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk{min-height:78px;font-size:19px;font-weight:600;flex-direction:column}
.mk small{font-size:12px;font-weight:400;opacity:.85}
.c红{background:#d93a3a}.c橙{background:#e8822a}.c黄{background:#d9b520;color:#111}.c蓝{background:#2f7be0}.c灰{background:#6b7280}
.mk.c灰{grid-column:span 2;min-height:56px}
#cl{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
#cl button{flex:none;min-height:44px;font-size:14px;background:#14532d;border:1px solid #22c55e;padding:6px 12px}
#cl button.done{background:#3b2a5a;border-color:#a78bfa;opacity:.7}
#list .it{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #222}
#list .dot{width:14px;height:14px;border-radius:50%;flex:none}
#list .t{font-variant-numeric:tabular-nums;min-width:62px;color:#aab;padding:8px 0}
#list .n{flex:1;font-size:14px;color:#ddd}
#list button{min-height:40px;padding:6px 10px;font-size:14px}
details summary{padding:8px 0;color:#9aa}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;display:none;z-index:9}
</style></head><body>
<h1>把中国讲给你听 · 手机听稿</h1>
<div style="font-size:15px;margin:4px 0 10px;opacity:.85">选音频后点颜色记问题；听完点分享发给我</div>
<div class="card" style="font-size:20px;line-height:1.7;background:#fffbe6;color:#222">
 <div style="font-size:24px;font-weight:bold;margin-bottom:6px">怎么用</div>
 <div>1. 点 <b>▶︎ 播放</b> 听</div>
 <div>2. 听到不对的地方，马上点颜色：<br>
 <span style="color:#d22;font-weight:bold">红</span>＝念错　<span style="color:#e67e00;font-weight:bold">橙</span>＝太快／停顿怪<br>
 <span style="color:#b59a00;font-weight:bold">黄</span>＝听不懂　<span style="color:#2a62d6;font-weight:bold">蓝</span>＝声音效果</div>
 <div>3. 听完点 <b>「分享」</b> → 选 <b>微信</b> 发给孩子<br>　或点 <b>「复制清单」</b>，粘贴到微信发过去</div>
 <div style="font-size:17px;opacity:.8">4.（可选）Safari 点分享 → 添加到主屏幕，以后一点就开</div>
 <div style="font-size:15px;opacity:.6;margin-top:6px">给 wei：换新版音频后刷新即可</div>
</div>
<div class="card">
 <label class="btn" style="width:100%">🎧 选音频<input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav" hidden></label>
 <details><summary>或粘贴网址/相对路径</summary><div class="row"><input id="url" type="text" placeholder="https://… 或 EP01_v7.mp3"><button id="load" style="flex:0 0 80px">载入</button></div></details>
 <div id="name">未选择音频</div>
</div>
<div class="card">
 <div id="time">00:00.0 / 00:00</div>
 <div id="bar"><div id="chips"></div><input id="seek" type="range" min="0" max="1000" value="0"></div>
 <div class="row" style="margin:8px 0"><button data-j="-15">-15</button><button data-j="-5">-5</button><button id="pp" style="flex:1.6;font-size:22px;background:#4a6cf7">▶︎</button><button data-j="5">+5</button><button data-j="15">+15</button></div>
 <div class="row"><button class="sp" data-s="0.8">0.8×</button><button class="sp on" data-s="1">1×</button><button class="sp" data-s="1.1">1.1×</button></div>
 <div id="clwrap" style="display:none;margin-top:10px"><div style="font-size:13px;color:#86efac">改过（点一下跳过去听）</div><div id="cl"></div></div>
</div>
<div class="card marks">
 <button class="mk c红" data-c="红">红<small>念错</small></button>
 <button class="mk c橙" data-c="橙">橙<small>太快/停顿怪</small></button>
 <button class="mk c黄" data-c="黄">黄<small>听不懂</small></button>
 <button class="mk c蓝" data-c="蓝">蓝<small>音效</small></button>
 <button class="mk c灰" data-c="灰">灰 · 备注</button>
</div>
<div class="card">
 <div class="row"><button id="undo">↶ 撤销</button><button id="copy">复制清单</button></div>
 <div class="row" style="margin-top:8px"><button id="share">分享</button><button id="json">下载JSON</button></div>
 <div id="list"></div>
</div>
<div class="card"><details><summary>载入「改过」清单（JSON 或 Markdown）</summary>
 <textarea id="clraw" rows="5" placeholder='[{"t":"15:32.0","label":"背抵着柱子 bèi","version":"v7"}]&#10;或每行：- 15:32.0 背抵着柱子 (v7)'></textarea>
 <div class="row" style="margin-top:8px"><button id="clsave">保存改过清单</button><label class="btn">选文件<input id="clfile" type="file" accept=".json,.md,.txt,application/json,text/*" hidden></label></div></details>
<details><summary>可选：粘贴 SRT 或 r001|时间|句子 行表（标记自动带句号）</summary>
 <textarea id="lines" rows="5" placeholder="r001|00:01.2|第一句…  或标准 SRT"></textarea>
 <button id="saveLines" style="width:100%;margin-top:8px">保存行表</button></details></div>
<audio id="au" preload="metadata" playsinline></audio>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const TAG={红:'念错',橙:'太快/停顿怪',黄:'文案/听感',蓝:'音效',灰:'备注'};
const COL={红:'#d93a3a',橙:'#e8822a',黄:'#d9b520',蓝:'#2f7be0',灰:'#6b7280'};
let key='',marks=[],lines=[],cls=[];
const fmt=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60);let r=(Math.floor(s%60*10)/10).toFixed(1);return String(m).padStart(2,'0')+':'+r.padStart(4,'0')};
const esc=s=>String(s||'').replace(/[<&]/g,c=>c=='<'?'&lt;':'&amp;');
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1400)};
const MEM={};let LSOK=true;try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){LSOK=false}
const LS=(k,v)=>{const K=(key||'ep:EP01_v7')+k;if(v===undefined){try{return JSON.parse((LSOK?localStorage[K]:MEM[K])||'null')}catch(e){return null}}const j=JSON.stringify(v);try{if(LSOK)localStorage[K]=j;else MEM[K]=j}catch(e){LSOK=false;MEM[K]=j}};
const DEFAULT_CL='[\n  {\n    "t": "15:32.0",\n    "label": "背→bèi（背抵着柱子）",\n    "version": "v7"\n  },\n  {\n    "t": "16:51.0",\n    "label": "公元前二百二十二年",\n    "version": "v7"\n  },\n  {\n    "t": "17:23.0",\n    "label": "皇帝·铜钟收束",\n    "version": "v7"\n  }\n]';
function setSrc(src,name){au.src=src;key='qa:'+name;$('#name').textContent=name;marks=LS('')||[];lines=LS(':lines')||[];cls=LS(':cl')||[];if(!cls.length)setTimeout(()=>loadCL(DEFAULT_CL));$('#lines').value=LS(':raw')||'';$('#clraw').value=LS(':clraw')||'';render()}
$('#file').onchange=e=>{const f=e.target.files[0];if(f)setSrc(URL.createObjectURL(f),f.name)};
$('#load').onclick=()=>{const u=$('#url').value.trim();if(u)setSrc(u,decodeURIComponent(u.split('/').pop().split('?')[0]))};
const save=()=>{if(key)LS('',marks)};
$('#pp').onclick=()=>au.paused?au.play():au.pause();
au.onplay=au.onpause=()=>$('#pp').textContent=au.paused?'▶︎':'❚❚';
const jump=t=>{au.currentTime=Math.max(0,t);if(au.paused)au.play()};
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>au.currentTime=Math.max(0,au.currentTime+ +b.dataset.j));
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{au.playbackRate=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b))});
let drag=false;const sk=$('#seek');
sk.oninput=()=>{drag=true;if(au.duration)$('#time').textContent=fmt(sk.value/1000*au.duration)+' / '+fmt(au.duration).slice(0,5)};
sk.onchange=()=>{if(au.duration)au.currentTime=sk.value/1000*au.duration;drag=false};
au.ontimeupdate=au.onloadedmetadata=()=>{if(!drag){sk.value=au.duration?au.currentTime/au.duration*1000:0;$('#time').textContent=fmt(au.currentTime)+' / '+fmt(au.duration).slice(0,5)}};
au.addEventListener('loadedmetadata',renderChips);
function ts(x){if(typeof x=='number')return x>10000?x/1000:x;const p=String(x).trim().replace(',','.').split(':').map(Number);return p.reduce((a,b)=>a*60+b,0)}
function parseLines(raw){const out=[];
 if(/-->/.test(raw)){raw.split(/\n\s*\n/).forEach((b,i)=>{const L=b.trim().split('\n');const k=L.findIndex(l=>l.includes('-->'));if(k<0)return;out.push({id:'r'+String(i+1).padStart(3,'0'),t:ts(L[k].split('-->')[0]),text:L.slice(k+1).join(' ')})})}
 else raw.split('\n').forEach(l=>{const p=l.split('|').map(s=>s.trim());if(!p[0])return;let t=null,text=p.slice(1).join('|');if(p[1]&&/^\d+(:\d+)*([.,]\d+)?$/.test(p[1])){t=ts(p[1]);text=p.slice(2).join('|')}out.push({id:p[0],t,text})});
 return out}
$('#saveLines').onclick=()=>{const raw=$('#lines').value;lines=parseLines(raw);if(key){LS(':lines',lines);LS(':raw',raw)}toast('行表 '+lines.length+' 行')};
function parseCL(raw){raw=raw.trim();try{let j=JSON.parse(raw);if(!Array.isArray(j))j=j.markers||j.changes||[];return j.map(o=>({t:ts(o.t_ms!=null?o.t_ms/1000:o.t),label:o.label||o.text||'',version:o.version||''}))}catch(e){}
 const out=[];raw.split('\n').forEach(l=>{const m=l.match(/(\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d+)?)\s*[|｜:：\-—]?\s*(.*)/);if(!m)return;let label=m[2].trim(),v='';const vm=label.match(/[（(\[]?\b(v\d+[\w.]*)\b[)）\]]?/i);if(vm){v=vm[1];label=label.replace(vm[0],'').trim()}out.push({t:ts(m[1]),label:label.replace(/^[|｜\-—:：\s]+/,''),version:v})});return out}
function loadCL(raw){if(!key)key='ep:EP01_v7';cls=parseCL(raw).sort((a,b)=>a.t-b.t);LS(':cl',cls);LS(':clraw',raw);$('#clraw').value=raw;render();toast('改过 '+cls.length+' 处')}
$('#clsave').onclick=()=>loadCL($('#clraw').value);
$('#clfile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(loadCL)};
$('#cl').onclick=e=>{const i=e.target.closest('button')?.dataset.i;if(i==null)return;jump(Math.max(0,cls[i].t-2));cls[i].done=1;LS(':cl',cls);renderCL()};
function nearest(t){let best=null;lines.forEach(l=>{if(l.t!=null&&l.t<=t+0.3&&(!best||l.t>best.t))best=l});return best}
document.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{if(!key)key='ep:EP01_v7';b.style.outline='4px solid #fff';setTimeout(()=>b.style.outline='',300);const t=au.currentTime,c=b.dataset.c,l=nearest(t);
 const m={t_ms:Math.round(t*1000),time:fmt(t),color:c,tag:TAG[c],note:'',line:l?l.id:'',text:l?l.text:'',_c:Date.now()};marks.push(m);marks.sort((a,b)=>a.t_ms-b.t_ms);save();render();navigator.vibrate&&navigator.vibrate(30);toast(c+' '+m.time+(l?' '+l.id:''));
 if(c==='灰'){const n=(document.getElementById('note')||{}).value;if(n){m.note=n;document.getElementById('note').value='';save();render()}}});
$('#undo').onclick=()=>{if(!marks.length)return;let i=marks.reduce((a,m,j)=>(m._c||0)>(marks[a]._c||0)?j:a,0);marks.splice(i,1);save();render();toast('已撤销')};
function renderCL(){$('#clwrap').style.display=cls.length?'block':'none';$('#cl').innerHTML=cls.map((c,i)=>`<button data-i="${i}" class="${c.done?'done':''}">改过 ${fmt(c.t)}${c.version?' '+esc(c.version):''}<br><small>${esc(c.label).slice(0,14)}</small></button>`).join('')}
function render(){$('#list').innerHTML=marks.map((m,i)=>`<div class="it"><span class="dot" style="background:${COL[m.color]}"></span><span class="t" data-g="${i}">${m.time}</span><span class="n">${m.line?'['+m.line+'] ':''}${m.tag}${m.note?'：'+esc(m.note):''}</span><button data-e="${i}">✎</button><button data-d="${i}">✕</button></div>`).join('')||'<div style="color:#667;padding:10px 0">还没有标记</div>';renderCL();renderChips()}
function renderChips(){const d=au.duration;$('#chips').innerHTML=d?marks.map(m=>`<i style="left:calc(${m.t_ms/10/d}% - 2px);background:${COL[m.color]}"></i>`).join('')+cls.map(c=>`<i class="cg" style="left:calc(${c.t*100/d}% - 4px)"></i>`).join(''):''}
$('#list').onclick=e=>{const g=e.target.dataset;if(g.g)jump(marks[g.g].t_ms/1000);if(g.e){const n=prompt('备注',marks[g.e].note);if(n!==null){marks[g.e].note=n;save();render()}}if(g.d&&confirm('删除这条？')){marks.splice(g.d,1);save();render()}};
function md(){return `# 听稿标记：${key.slice(3)}\n共 ${marks.length} 处（时间 mm:ss.s）\n\n`+marks.map(m=>`- [ ] ${m.time} 【${m.color}·${m.tag}】${m.line?' '+m.line:''}${m.text?' 「'+m.text+'」':''}${m.note?' — '+m.note:''}`).join('\n')+(cls.length?`\n\n改过已听：${cls.filter(c=>c.done).length}/${cls.length}`:'')}
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(md());toast('已复制')}catch(e){prompt('长按全选复制',md())}};
$('#share').onclick=()=>navigator.share?navigator.share({title:'听稿标记',text:md()}).catch(()=>{}):$('#copy').onclick();
$('#json').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({file:key.slice(3),exported:new Date().toISOString(),marks:marks.map(({_c,...m})=>m),changelog:cls},null,2)],{type:'application/json'}));a.download=key.slice(3).replace(/\.\w+$/,'')+'_marks.json';a.click()};
render();
</script><input id="note" placeholder="灰色备注先写这里再点灰" style="width:100%;font-size:18px;margin:8px 0">
<style>.mk{min-height:64px;font-size:20px;touch-action:manipulation}.mk *{pointer-events:none}</style>
<script>try{if(!LSOK)toast('此模式不能存，听完记得点复制/分享');if(!cls||!cls.length)loadCL(DEFAULT_CL)}catch(e){}</script><script>
(async()=>{try{let v='EP01_latest';try{const r=await fetch('audio/version.txt?'+Date.now());if(r.ok)v=(await r.text()).trim()}catch(e){}
const h=await fetch('audio/latest.mp3',{method:'HEAD',cache:'no-store'});if(h.ok&&typeof setSrc==='function'){setSrc('audio/latest.mp3?v='+encodeURIComponent(v),v)}}catch(e){}})();
</script></body></html>
